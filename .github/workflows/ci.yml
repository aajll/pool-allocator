name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build the library and run the full test suite under ASan + UBSan across
  # the full configuration matrix: lookup strategy × atomicity mode.
  # ---------------------------------------------------------------------------
  test:
    name: "Test (${{ matrix.lookup_strategy }}, ${{ matrix.atomicity_mode }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lookup_strategy: [linear, hash]
        atomicity_mode: [c11, volatile]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined
          -Dlookup_strategy=${{ matrix.lookup_strategy }}
          -Datomicity_mode=${{ matrix.atomicity_mode }}

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ matrix.lookup_strategy }}-${{ matrix.atomicity_mode }}
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Release build matrix - the configuration a downstream project would use.
  # No sanitizers, no tests; just verify the library compiles cleanly across
  # the same configuration axes.
  # ---------------------------------------------------------------------------
  release-build:
    name: "Release (${{ matrix.lookup_strategy }}, ${{ matrix.atomicity_mode }})"
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        lookup_strategy: [linear, hash]
        atomicity_mode: [c11, volatile]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure
        run: >
          meson setup build
          --buildtype=release
          -Dbuild_tests=false
          -Dlookup_strategy=${{ matrix.lookup_strategy }}
          -Datomicity_mode=${{ matrix.atomicity_mode }}

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Non-default layout options. The tests compile against pool_dep only, so
  # they fail if the dependency does not carry the layout defines; the
  # installed pool.pc must carry them too.
  # ---------------------------------------------------------------------------
  layout-options:
    name: "Layout options (4 slots of 32)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined
          -Dpool_max_slots=4
          -Dpool_item_size=32
          -Dlookup_strategy=hash
          -Datomicity_mode=volatile

      - name: Test
        run: meson test -C build --verbose

      - name: Check the installed pkg-config flags
        run: |
          meson install -C build --destdir "$PWD/staging"
          export PKG_CONFIG_PATH="$(dirname "$(find staging -name pool.pc)")"
          flags="$(pkg-config --cflags pool)"
          echo "$flags"
          for define in -DPOOL_MAX_SLOTS=4 -DPOOL_ITEM_SIZE=32 -DPOOL_USE_VOLATILE_ATOMIC; do
            case " $flags " in
              *" $define "*) ;;
              *) echo "missing $define"; exit 1 ;;
            esac
          done

  # ---------------------------------------------------------------------------
  # Static analysis with cppcheck. Runs against the source and the public
  # headers; fails on any warning/style/performance/portability finding
  # that is not silenced by an inline `cppcheck-suppress` comment.
  # ---------------------------------------------------------------------------
  cppcheck:
    name: "Static analysis (cppcheck)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --inline-suppr
          --std=c11
          --suppress=missingIncludeSystem
          --suppress=unusedFunction
          -I include
          src/ include/

  # ---------------------------------------------------------------------------
  # ThreadSanitizer gate. Exercises the documented single-writer /
  # many-readers concurrency contract from tests/test_pool_concurrency.c
  # under TSAN. The c11 atomicity mode (default) must remain race-free;
  # TSAN runs only in c11 mode because the volatile path is expected
  # (and documented) to report races on a multi-core host.
  #
  # TSAN is incompatible with ASan, so it lives in its own job.
  # ---------------------------------------------------------------------------
  tsan:
    name: "ThreadSanitizer (c11 concurrency)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + tests + tsan, c11 atomicity)
        run: >
          meson setup build_tsan
          --buildtype=debug
          -Dbuild_tests=true
          -Dtsan=true
          -Datomicity_mode=c11

      - name: Build
        run: meson compile -C build_tsan

      - name: Test under ThreadSanitizer
        run: meson test -C build_tsan --verbose --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: build_tsan/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # 16-bit MAU simulation gate. Builds a second copy of the library with
  # -DPOOL_SIMULATE_16BIT_MAU on a byte-addressable host, then runs the
  # same test sources against it. This exercises the pool_byte_t ==
  # uint16_t code path that the TI C2000 cross-build would compile but
  # cannot execute in CI (the TI toolchain is not available on GitHub
  # runners).
  # ---------------------------------------------------------------------------
  sim-16bit:
    name: "16-bit MAU simulation (host)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + tests + sanitizers)
        run: >
          meson setup build_sim
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build_sim

      - name: Run the 16-bit sim test variant
        run: meson test -C build_sim --verbose test_pool_16bit_sim

  # ---------------------------------------------------------------------------
  # Memory-error gate with Valgrind. Runs the test suite under
  # `memcheck` without compiler sanitizers (ASan and Valgrind are
  # incompatible). Any leak, invalid read/write, or uninitialised use
  # fails the job.
  # ---------------------------------------------------------------------------
  valgrind:
    name: "Memory check (Valgrind)"
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        atomicity_mode: [c11, volatile]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install valgrind
        run: sudo apt-get update -q && sudo apt-get install -y valgrind

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug, no sanitizers)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Datomicity_mode=${{ matrix.atomicity_mode }}

      - name: Build
        run: meson compile -C build

      - name: Test under Valgrind
        run: >
          meson test -C build --verbose --no-suite docs
          --wrapper='valgrind --error-exitcode=1 --leak-check=full
          --show-leak-kinds=all --track-origins=yes --errors-for-leak-kinds=all'

      - name: Upload Valgrind log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-${{ matrix.atomicity_mode }}
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Code coverage gate. Builds both lookup strategies with gcov
  # instrumentation, runs the full test suite for each, and fails the job
  # unless line and branch coverage across both reach 100 %.
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson, ninja and gcovr
        run: uv tool install meson && uv tool install ninja && uv tool install gcovr

      - name: Build and test both lookup strategies (coverage)
        run: |
          for strategy in linear hash; do
            meson setup "build-$strategy" \
              --buildtype=debug \
              -Dbuild_tests=true \
              -Db_coverage=true \
              -Dc_args=-fprofile-update=atomic \
              -Dlookup_strategy=$strategy
            meson compile -C "build-$strategy"
            meson test -C "build-$strategy" --verbose
          done

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-branch 100 \
            build-linear build-hash

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ---------------------------------------------------------------------------
  # Cross-build the library with the TI C2000 code generation tools, where
  # CHAR_BIT is 16, under both object formats with warnings as errors.
  # ---------------------------------------------------------------------------
  c2000:
    name: "TI C2000 (CGT ${{ matrix.cgt }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgt: "22.6.2"
            sha256: "9773f338df7b7314bc459be2cd9d9bf329786da8de6531f8f2d3d38c1e9f5750"
          - cgt: "25.11.1"
            sha256: "2f3a978e24a53279c9796ad374c32b530fc58fd085fd71288597846fe169c821"

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Cache TI C2000 CGT
        id: cache-cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c2000-${{ matrix.cgt }}

      - name: Install TI C2000 CGT
        if: steps.cache-cgt.outputs.cache-hit != 'true'
        run: |
          bin="ti_cgt_c2000_${{ matrix.cgt }}.LTS_linux-x64_installer.bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$bin" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-xqxJ05PLfM/${{ matrix.cgt }}.LTS/$bin"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$bin"
          "$RUNNER_TEMP/$bin" --mode unattended --prefix "$HOME/ti"

      - name: Configure and build (COFF and EABI, both strategies)
        run: |
          CGT="$HOME/ti/ti-cgt-c2000_${{ matrix.cgt }}.LTS"
          for abi in coffabi eabi; do
            cat > "c2000-$abi.ini" <<INI
          [binaries]
          c = '$CGT/bin/cl2000'
          ar = '$CGT/bin/ar2000'
          strip = '$CGT/bin/strip2000'

          [built-in options]
          c_args = ['-v28', '--float_support=fpu32', '--abi=$abi', '-I$CGT/include']

          [host_machine]
          system = 'bare-metal'
          cpu_family = 'c2000'
          cpu = 'c28x'
          endian = 'little'
          INI
            for strategy in linear hash; do
              meson setup "build-$abi-$strategy" --cross-file="c2000-$abi.ini" \
                -Dbuild_tests=false -Dwerror=true -Dlookup_strategy=$strategy
              meson compile -C "build-$abi-$strategy"
            done
          done

  # ---------------------------------------------------------------------------
  # Formatting check with the clang-format release pinned in scripts/format.sh.
  # ---------------------------------------------------------------------------
  format:
    name: "clang-format"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Check formatting
        run: scripts/format.sh

  # ---------------------------------------------------------------------------
  # MISRA C:2023 analysis with misch, once per atomicity mode. CI fails on any
  # finding outside that mode's baseline in analysis/baseline/.
  # ---------------------------------------------------------------------------
  misra:
    name: "MISRA (misch)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0

      # Ubuntu 24.04 ships cppcheck 2.13, whose findings differ from current
      # releases. The Homebrew bottle is current; brew is preinstalled.
      - name: Install cppcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cppcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cppcheck --version

      - name: Install meson, ninja and misch
        run: uv tool install meson && uv tool install ninja && uv tool install misch

      - name: Configure (compile database)
        run: meson setup build --buildtype=debug -Dbuild_tests=true

      - name: Analyse (C11 atomics)
        run: misch run --baseline -v

      - name: Analyse (volatile)
        run: misch run --baseline --profile volatile -v

      - name: Deviation record
        run: misch deviations
